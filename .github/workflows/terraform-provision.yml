name: AgentOps AI - OCI Provisioning

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentops-terraform-provisioning
  cancel-in-progress: false

jobs:
  provision:
    name: Terraform Provisioning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"

      - name: Verify Terraform installation
        run: terraform version

      - name: Configure OCI authentication
        shell: bash
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.oci"
          chmod 700 "$HOME/.oci"

          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/agentops_api_key.pem"
          chmod 600 "$HOME/.oci/agentops_api_key.pem"

          {
            echo "[DEFAULT]"
            echo "user=$OCI_USER_OCID"
            echo "fingerprint=$OCI_FINGERPRINT"
            echo "tenancy=$OCI_TENANCY_OCID"
            echo "region=$OCI_REGION"
            echo "key_file=$HOME/.oci/agentops_api_key.pem"
          } > "$HOME/.oci/config"

          chmod 600 "$HOME/.oci/config"

          echo "OCI_CONFIG_FILE=$HOME/.oci/config" >> "$GITHUB_ENV"
          echo "OCI_CLI_CONFIG_FILE=$HOME/.oci/config" >> "$GITHUB_ENV"
          echo "OCI_CLI_PROFILE=DEFAULT" >> "$GITHUB_ENV"
          echo "OCI_CLI_AUTH=api_key" >> "$GITHUB_ENV"
          echo "OCI_CLI_USER=$OCI_USER_OCID" >> "$GITHUB_ENV"
          echo "OCI_CLI_TENANCY=$OCI_TENANCY_OCID" >> "$GITHUB_ENV"
          echo "OCI_CLI_FINGERPRINT=$OCI_FINGERPRINT" >> "$GITHUB_ENV"
          echo "OCI_CLI_REGION=$OCI_REGION" >> "$GITHUB_ENV"
          echo "OCI_CLI_KEY_FILE=$HOME/.oci/agentops_api_key.pem" >> "$GITHUB_ENV"
      - name: Initialize Terraform
        working-directory: infrastructure/terraform
        run: terraform init -input=false

      - name: Validate Terraform configuration
        working-directory: infrastructure/terraform
        run: terraform validate
