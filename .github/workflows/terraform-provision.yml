name: AgentOps AI - OCI Provisioning

on:
  workflow_dispatch:
    inputs:
      availability_domain:
        description: "OCI availability domain to attempt"
        required: true
        type: choice
        default: "0"
        options:
          - "0"
          - "1"
          - "2"

      max_attempts:
        description: "Maximum OCI provisioning attempts"
        required: true
        type: choice
        default: "3"
        options:
          - "3"
          - "6"
          - "9"

      retry_delay_seconds:
        description: "Seconds to wait between OCI capacity retries"
        required: true
        type: choice
        default: "60"
        options:
          - "60"
          - "120"
          - "300"

      confirm_provisioning:
        description: "Confirm OCI VM provisioning"
        required: true
        type: boolean
        default: false

      execute_provisioning:
        description: "Allow Terraform to create the OCI VM"
        required: true
        type: boolean
        default: false

      test_retry_loop:
        description: "Test retry-loop safety checks without creating a VM"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agentops-terraform-provisioning
  cancel-in-progress: false

jobs:
  provision:
    name: Terraform Provisioning
    if: inputs.execute_provisioning != true || inputs.confirm_provisioning == true
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash
        working-directory: infrastructure/terraform

    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_availability_domain_index: ${{ inputs.availability_domain }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"

      - name: Verify Terraform installation
        run: terraform version

      - name: Configure OCI authentication
        shell: bash
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.oci"
          chmod 700 "$HOME/.oci"

          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/agentops_api_key.pem"
          chmod 600 "$HOME/.oci/agentops_api_key.pem"

          {
            echo "[DEFAULT]"
            echo "user=$OCI_USER_OCID"
            echo "fingerprint=$OCI_FINGERPRINT"
            echo "tenancy=$OCI_TENANCY_OCID"
            echo "region=$OCI_REGION"
            echo "key_file=$HOME/.oci/agentops_api_key.pem"
          } > "$HOME/.oci/config"

          chmod 600 "$HOME/.oci/config"

          {
            echo "OCI_CONFIG_FILE=$HOME/.oci/config"
            echo "OCI_CLI_CONFIG_FILE=$HOME/.oci/config"
            echo "OCI_CLI_PROFILE=DEFAULT"
            echo "OCI_CLI_AUTH=api_key"
            echo "OCI_CLI_USER=$OCI_USER_OCID"
            echo "OCI_CLI_TENANCY=$OCI_TENANCY_OCID"
            echo "OCI_CLI_FINGERPRINT=$OCI_FINGERPRINT"
            echo "OCI_CLI_REGION=$OCI_REGION"
            echo "OCI_CLI_KEY_FILE=$HOME/.oci/agentops_api_key.pem"
          } >> "$GITHUB_ENV"

      - name: Install OCI CLI
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv "$RUNNER_TEMP/oci-cli-venv"
          "$RUNNER_TEMP/oci-cli-venv/bin/pip" install oci-cli

          echo "$RUNNER_TEMP/oci-cli-venv/bin" >> "$GITHUB_PATH"

      - name: Initialize Terraform
        working-directory: infrastructure/terraform
        run: terraform init -input=false

      - name: Validate Terraform configuration
        working-directory: infrastructure/terraform
        run: terraform validate

      - name: Check existing VM state
        id: vm_state
        working-directory: infrastructure/terraform
        shell: bash
        run: |
          set -euo pipefail

          # Stop immediately if Terraform state cannot be read.
          if ! terraform state list > /tmp/agentops-state-list.txt; then
            echo "ERROR: Unable to read Terraform state. Provisioning stopped."
            exit 1
          fi

          if grep -Fxq 'oci_core_instance.agentops' /tmp/agentops-state-list.txt; then
            echo "An AgentOps AI VM is already tracked in Terraform state."
            echo "vm_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No AgentOps AI VM is currently tracked in Terraform state."
            echo "vm_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Terraform plan
        if: steps.vm_state.outputs.vm_exists == 'false'
        working-directory: infrastructure/terraform
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Verify Terraform plan safety
        if: steps.vm_state.outputs.vm_exists == 'false'
        working-directory: infrastructure/terraform
        shell: bash
        run: |
          set -euo pipefail

          terraform show -json tfplan | jq -e '
            [
              .resource_changes[]?
              | select(.change.actions != ["no-op"])
              | {
                  address: .address,
                  actions: .change.actions
                }
            ] as $changes
            |
            (
              $changes == [
                {
                  address: "oci_core_instance.agentops",
                  actions: ["create"]
                }
              ]
            )
            or
            (
              ($changes | length) == 0
              and
              (
                [
                  .planned_values.root_module.resources[]?
                  | select(
                      .address == "oci_core_instance.agentops"
                      and .mode == "managed"
                      and .values.id != null
                    )
                ] | length
              ) == 1
            )
          ' > /dev/null

          echo "Safety check passed: VM creation or no infrastructure changes."

      - name: Verify Always Free VM specifications
        if: steps.vm_state.outputs.vm_exists == 'false'
        working-directory: infrastructure/terraform
        shell: bash
        run: |
          set -euo pipefail

          terraform show -json tfplan | jq -e '
            [
              .resource_changes[]?
              | select(
                  .address == "oci_core_instance.agentops"
                  and .change.actions == ["create"]
                )
              | .change.after
              | select(
                  .shape == "VM.Standard.A1.Flex"
                  and .shape_config[0].ocpus == 2
                  and .shape_config[0].memory_in_gbs == 12
                  and .source_details[0].boot_volume_size_in_gbs == "50"
                  and .create_vnic_details[0].assign_public_ip == "true"
                )
            ] | length == 1
          ' > /dev/null && {
            echo "Approved VM specifications verified."
            exit 0
          }

          if terraform show -json tfplan | jq -e '
            [.resource_changes[]? |
              select(.change.actions != ["no-op"])
            ] | length == 0
          ' > /dev/null; then
            echo "No changes: existing VM configuration retained."
            exit 0
          fi

          echo "VM specifications failed verification."
          exit 1

      - name: Verify selected availability domain
        if: steps.vm_state.outputs.vm_exists == 'false'
        working-directory: infrastructure/terraform
        shell: bash
        env:
          SELECTED_AD: ${{ inputs.availability_domain }}
        run: |
          set -euo pipefail

          case "$SELECTED_AD" in
            0) EXPECTED_AD="yVvY:US-ASHBURN-AD-1" ;;
            1) EXPECTED_AD="yVvY:US-ASHBURN-AD-2" ;;
            2) EXPECTED_AD="yVvY:US-ASHBURN-AD-3" ;;
            *)
              echo "Invalid availability domain selection."
              exit 1
              ;;
          esac

          terraform show -json tfplan | jq -e --arg ad "$EXPECTED_AD" '
            (
              [
                .resource_changes[]?
                | select(
                    .address == "oci_core_instance.agentops"
                    and .change.actions == ["create"]
                    and .change.after.availability_domain == $ad
                  )
              ] | length
            ) == 1
            or
            (
              [
                .resource_changes[]?
                | select(.change.actions != ["no-op"])
              ] | length
            ) == 0
          ' > /dev/null

          echo "Availability domain verification passed."

      - name: Validate retry configuration
        shell: bash
        env:
          RETRY_DELAY: ${{ inputs.retry_delay_seconds }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
        run: |
          set -euo pipefail

          case "$RETRY_DELAY" in
            60|120|300) ;;
            *)
              echo "Invalid retry delay."
              exit 1
              ;;
          esac

          case "$MAX_ATTEMPTS" in
            3|6|9) ;;
            *)
              echo "Invalid maximum attempt count."
              exit 1
              ;;
          esac

          echo "Retry configuration validated."
          echo "Delay: ${RETRY_DELAY} seconds"
          echo "Maximum attempts: ${MAX_ATTEMPTS}"

      - name: Validate starting availability domain
        shell: bash
        env:
          START_AD: ${{ inputs.availability_domain }}
        run: |
          set -euo pipefail

          case "$START_AD" in
            0|1|2)
              echo "Starting availability domain index: $START_AD"
              ;;
            *)
              echo "ERROR: Invalid availability domain index."
              exit 1
              ;;
          esac

      - name: Verify provisioning mode
        shell: bash
        env:
          EXECUTE_PROVISIONING: ${{ inputs.execute_provisioning }}
        run: |
          set -euo pipefail

          case "$EXECUTE_PROVISIONING" in
            true)
              echo "Provisioning mode enabled."
              ;;
            false)
              echo "Dry-run mode enabled. No Terraform apply permitted."
              ;;
            *)
              echo "ERROR: Invalid provisioning mode."
              exit 1
              ;;
          esac

      - name: Preview availability domain retry sequence
        shell: bash
        env:
          START_AD: ${{ inputs.availability_domain }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
          RETRY_DELAY: ${{ inputs.retry_delay_seconds }}
        run: |
          set -euo pipefail

          echo "Planned OCI availability domain sequence:"

          for ((attempt=1; attempt<=MAX_ATTEMPTS; attempt++)); do
            ad_index=$(( (START_AD + attempt - 1) % 3 ))
            ad_number=$((ad_index + 1))

            echo "Attempt $attempt: US-ASHBURN-AD-$ad_number"
          done

          echo "Delay between attempts: ${RETRY_DELAY} seconds"
          echo "Maximum attempts: ${MAX_ATTEMPTS}"

      - name: Authorize Terraform provisioning
        id: provisioning_gate
        if: steps.vm_state.outputs.vm_exists == 'false'
        shell: bash
        env:
          EXECUTE_PROVISIONING: ${{ inputs.execute_provisioning }}
          CONFIRM_PROVISIONING: ${{ inputs.confirm_provisioning }}
        run: |
          set -euo pipefail

          if [[ "$EXECUTE_PROVISIONING" == "true" && "$CONFIRM_PROVISIONING" == "true" ]]; then
            echo "Provisioning explicitly authorized and confirmed."
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "Provisioning not authorized. Terraform apply is disabled."
            echo "authorized=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize provisioning retry loop
        if: inputs.test_retry_loop == true || steps.provisioning_gate.outputs.authorized == 'true'
        working-directory: infrastructure/terraform
        shell: bash
        env:
          START_AD: ${{ inputs.availability_domain }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
          RETRY_DELAY: ${{ inputs.retry_delay_seconds }}
          TEST_MODE: ${{ inputs.test_retry_loop }}
          AUTHORIZED: ${{ steps.provisioning_gate.outputs.authorized }}
        run: |
          set -euo pipefail

          if [[ "$TEST_MODE" != "true" && "$AUTHORIZED" != "true" ]]; then
            echo "ERROR: Provisioning is not authorized."
            exit 1
          fi

          check_existing_vm() {
            local state_file="$RUNNER_TEMP/agentops-retry-state.txt"

            if ! terraform state list > "$state_file"; then
              echo "ERROR: Unable to read Terraform state."
              return 1
            fi

            if [[ -s "$state_file" ]]; then
              echo "ERROR: Terraform state contains managed resources."
              echo "Stopping to prevent duplicate or partial provisioning."
              return 10
            fi

            "$RUNNER_TEMP/oci-cli-venv/bin/python" - <<'PY'
          import os
          import sys
          import oci

          compartment_id = (
              "ocid1.compartment.oc1.."
              "aaaaaaaawv5hkgwxbpwsefyyyojdfaxjgjk6a4l7bcrwbgclfcoq2czecheq"
          )

          try:
              config = oci.config.from_file(
                  file_location=os.environ["OCI_CLI_CONFIG_FILE"],
                  profile_name=os.environ.get("OCI_CLI_PROFILE", "DEFAULT"),
              )
              client = oci.core.ComputeClient(config)
              instances = oci.pagination.list_call_get_all_results(
                  client.list_instances,
                  compartment_id=compartment_id,
              ).data

              matches = [
                  instance for instance in instances
                  if instance.display_name == "agentops-ai"
                  and instance.lifecycle_state != "TERMINATED"
              ]

              print(f"Existing AgentOps AI instances: {len(matches)}")

              if matches:
                  sys.exit(10)

          except Exception as exc:
              print(f"ERROR: OCI check failed: {type(exc).__name__}")
              sys.exit(1)
          PY
          }

          echo "Test mode: $TEST_MODE"
          echo "Maximum attempts: $MAX_ATTEMPTS"
          echo "Retry delay: $RETRY_DELAY seconds"

          for ((attempt=1; attempt<=MAX_ATTEMPTS; attempt++)); do
            ad_index=$(( (START_AD + attempt - 1) % 3 ))
            export TF_VAR_availability_domain_index="$ad_index"

            case "$ad_index" in
              0) EXPECTED_AD="yVvY:US-ASHBURN-AD-1" ;;
              1) EXPECTED_AD="yVvY:US-ASHBURN-AD-2" ;;
              2) EXPECTED_AD="yVvY:US-ASHBURN-AD-3" ;;
              *) echo "ERROR: Invalid availability domain."; exit 1 ;;
            esac

            echo "Attempt $attempt of $MAX_ATTEMPTS: $EXPECTED_AD"

            if check_existing_vm; then
              echo "No existing VM detected."
            else
              status=$?
              if [[ "$status" -eq 10 ]]; then
                echo "Existing VM detected. Stopping safely."
                if [[ "$attempt" -eq 1 ]]; then
                  exit 0
                fi
                echo "ERROR: A VM appeared after a previous attempt. Review Terraform state before continuing."
              fi
              exit 1
            fi

            rm -f tfplan

            terraform plan -input=false -no-color -out=tfplan
            terraform show -json tfplan > "$RUNNER_TEMP/agentops-retry-plan.json"

            jq -e --arg ad "$EXPECTED_AD" '
              [
                .resource_changes[]?
                | select(.change.actions != ["no-op"])
                | {address: .address, actions: .change.actions}
              ] == [
                {
                  address: "oci_core_instance.agentops",
                  actions: ["create"]
                }
              ]
              and
              (
                [
                  .resource_changes[]?
                  | select(
                      .address == "oci_core_instance.agentops"
                      and .change.actions == ["create"]
                      and .change.after.availability_domain == $ad
                      and .change.after.shape == "VM.Standard.A1.Flex"
                      and .change.after.shape_config[0].ocpus == 2
                      and .change.after.shape_config[0].memory_in_gbs == 12
                      and .change.after.source_details[0].boot_volume_size_in_gbs == "50"
                      and .change.after.create_vnic_details[0].assign_public_ip == "true"
                    )
                ] | length
              ) == 1
            ' "$RUNNER_TEMP/agentops-retry-plan.json" > /dev/null

            echo "Terraform plan safety checks passed."

            if [[ "$TEST_MODE" == "true" ]]; then
              echo "Test mode: skipping Terraform apply."
              continue
            fi

            if [[ "$AUTHORIZED" != "true" ]]; then
              echo "ERROR: Terraform apply authorization missing."
              exit 1
            fi

            echo "Applying approved Terraform plan..."

            if terraform apply -input=false -no-color tfplan \
              > "$RUNNER_TEMP/agentops-apply.log" 2>&1; then
              echo "Terraform apply completed successfully."
              cat "$RUNNER_TEMP/agentops-apply.log"
              exit 0
            fi

            echo "Terraform apply failed. Checking failure category."

            if ! grep -Eiq \
              'Out of host capacity|OutOfHostCapacity|Out of capacity|OutOfCapacity' \
              "$RUNNER_TEMP/agentops-apply.log"; then
              echo "ERROR: Failure was not a recognized capacity error."
              echo "Stopping without retrying."
              exit 1
            fi

            echo "Recognized OCI capacity failure."

            if check_existing_vm; then
              echo "No existing VM detected after capacity failure."
            else
              echo "ERROR: Cannot safely retry after failed apply."
              echo "Inspect OCI and Terraform state before continuing."
              exit 1
            fi

            if [[ "$attempt" -lt "$MAX_ATTEMPTS" ]]; then
              echo "Waiting $RETRY_DELAY seconds before next availability domain."
              sleep "$RETRY_DELAY"
            fi
          done

          if [[ "$TEST_MODE" == "true" ]]; then
            echo "All $MAX_ATTEMPTS availability-domain plans validated."
            echo "No Terraform apply command was executed."
          else
            echo "All $MAX_ATTEMPTS provisioning attempts exhausted."
            exit 1
          fi
